<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f33">
  <title>Gulf Market Tracker — Synthetic Equity Dashboard</title>
  <style>
    :root{--navy:#0b1f33;--navy2:#173451;--ink:#14263b;--muted:#718096;--line:#dce3e8;--paper:#f3f6f7;--white:#fff;--teal:#11b8a7;--green:#18a957;--red:#e43c3c;--blue:#5376ed;--gold:#d99627;--shadow:0 5px 18px #10243a0b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}
    .top{height:82px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:24px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{width:34px;height:34px;border:1px solid #38d3c0;border-radius:10px;display:grid;place-items:center;color:#42dfcc;font-size:20px;font-weight:700}.brand-title{font-size:20px;font-weight:750;letter-spacing:.045em;white-space:nowrap}.brand-sub{color:#9ebdca;font-size:15px;border-left:1px solid #698097;padding-left:13px;white-space:nowrap}.tabs{display:flex;gap:8px}.tab{border:0;border-radius:8px;padding:10px 16px;background:#1b3b5d;color:#eaf1f6;font-weight:600}.tab.active{background:var(--teal);color:#fff}.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:#203d57;color:#c8d8e4;border:1px solid #466079;padding:6px 10px;border-radius:99px;white-space:nowrap}
    main{max-width:1600px;margin:auto;padding:18px 28px 30px}.filters{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr auto;gap:12px;margin-bottom:14px}.filter{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:0}.filter label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.filter input,.filter select{border:0;background:transparent;color:var(--ink);width:100%;outline:none;font-size:14px}.filter-dates{display:flex;gap:12px}.filter-dates input{min-width:0}.reset{align-self:stretch;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:0 15px;font-weight:650}.reset:hover,.tab:hover{filter:brightness(1.06)}
    .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.kpi,.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.kpi{padding:13px 16px;min-height:98px}.kpi-label{font-size:12px;color:var(--muted);font-weight:600}.kpi-value{font-size:29px;font-weight:760;letter-spacing:-.035em;margin-top:5px;line-height:1.1}.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:14px 16px;min-width:0}.panel h2{font-size:15px;line-height:1.25;margin:0 0 10px;font-weight:730}.panel .sub{font-weight:450;font-size:11px;color:var(--muted);margin-left:5px}.chart{height:260px;width:100%;display:block;overflow:visible}.chart text{font-family:inherit;fill:#758398;font-size:10px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#5d6b7b;margin-top:2px}.legend span{display:inline-flex;align-items:center;gap:5px}.swatch{width:10px;height:3px;border-radius:3px;display:inline-block}.barlist{display:flex;flex-direction:column;gap:8px;padding:5px 0}.barrow{display:grid;grid-template-columns:145px 1fr 55px;gap:9px;align-items:center;font-size:12px}.barname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#526174}.bartrack{height:12px;background:#eff2f4;border-radius:3px;overflow:hidden}.bar{height:100%;border-radius:3px}.barvalue{text-align:right;font-variant-numeric:tabular-nums;color:#344459}
    .foot{display:flex;justify-content:space-between;gap:12px;color:#788596;font-size:11px;padding:13px 3px 0}.empty{padding:40px 12px;text-align:center;color:var(--muted)}.tablewrap{overflow:auto;max-height:370px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:right;color:#748295;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}.table td{text-align:right;padding:8px;border-bottom:1px solid #edf0f2;font-variant-numeric:tabular-nums}.table th:first-child,.table td:first-child{text-align:left}.ticker{font-weight:700;color:#1c3651}.matrix{display:grid;gap:3px;overflow:auto}.mcell{min-width:35px;height:30px;display:grid;place-items:center;border-radius:4px;font-size:10px;font-variant-numeric:tabular-nums}.mhead{font-size:10px;color:#6b7887;display:grid;place-items:center}.detail-head{display:flex;gap:18px;align-items:center;margin:2px 0 14px}.company{font-size:22px;font-weight:750}.company-meta{color:var(--muted);font-size:12px}.detail-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.mini{background:#f7f9fa;border:1px solid #e9eef0;border-radius:8px;padding:10px 12px}.mini small{display:block;color:var(--muted)}.mini b{font-size:19px}.select-small{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}.note{border-left:3px solid var(--teal);background:#eef9f7;padding:10px 12px;color:#3d5d61;font-size:12px;border-radius:0 6px 6px 0}.loading{padding:80px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1050px){.filters{grid-template-columns:1fr 1fr}.reset{min-height:48px}.kpis{grid-template-columns:repeat(3,1fr)}.top{height:auto;min-height:82px;flex-wrap:wrap;padding:14px 20px}.tabs{order:3;width:100%;overflow:auto}.badge{margin-left:auto}}
    @media(max-width:700px){main{padding:13px}.top{padding:14px}.brand{flex-wrap:wrap}.brand-title{font-size:16px}.brand-sub{font-size:13px}.badge{display:none}.filters{grid-template-columns:1fr 1fr}.filter-dates{flex-direction:column;gap:4px}.kpis{grid-template-columns:1fr 1fr}.kpi-value{font-size:24px}.grid{grid-template-columns:1fr}.chart{height:225px}.barrow{grid-template-columns:108px 1fr 46px}.detail-kpis{grid-template-columns:1fr 1fr}.foot{flex-direction:column}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><div class="brand-mark">↗</div><div class="brand-title">GULF MARKET TRACKER</div><div class="brand-sub" id="pageTitle">Market Overview</div></div>
    <nav class="tabs" aria-label="Dashboard pages"><button class="tab active" data-page="overview">Overview</button><button class="tab" data-page="risk">Risk &amp; Return</button><button class="tab" data-page="detail">Stock Detail</button></nav>
    <div class="badge">Synthetic market data</div>
  </header>
  <main id="app"><div class="loading">Loading Gulf market data…</div></main>
  <script>
  const COLORS=['#11b8a7','#5376ed','#1b9fe0','#e7a02a','#e64444','#7757cf','#19a568','#d14f91','#438477','#8c6b42','#8c9f2d','#7482ac'];
  const $=s=>document.querySelector(s), fmt=(n,d=1)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}), pct=(n,d=1)=>`${n>=0?'+':''}${fmt(n,d)}%`, short=n=>n>=1e9?`${fmt(n/1e9,1)}B`:n>=1e6?`${fmt(n/1e6,1)}M`:fmt(n,0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let data,page='overview',stock='SKA',filter={sector:'All',exchange:'All',from:'2023-01-02',to:'2026-10-15'};
  fetch('./dashboard.json').then(r=>{if(!r.ok)throw Error('data');return r.json()}).then(d=>{data=d;filter.from=d.dates[0];filter.to=d.dates[d.dates.length-1];draw()}).catch(()=>$('#app').innerHTML='<div class="panel empty">Dashboard data did not load. Open this page from GitHub Pages or run a local web server from the project folder.</div>');
  const rows=()=>data.rows.filter(r=>r.date>=filter.from&&r.date<=filter.to&&(filter.sector==='All'||r.sector===filter.sector)&&(filter.exchange==='All'||r.exchange===filter.exchange));
  const dateRows=()=>{const m=new Map();rows().forEach(r=>{if(!m.has(r.date))m.set(r.date,r)});return [...m.values()].sort((a,b)=>a.date.localeCompare(b.date))};
  function retMap(source){const gs={};source.forEach(r=>(gs[r.ticker]??=[]).push(r));const out={};Object.entries(gs).forEach(([t,g])=>{g.sort((a,b)=>a.date.localeCompare(b.date));const a=g[0]?.close,b=g.at(-1)?.close;out[t]=a?100*(b/a-1):0});return out}
  function controls(){const sectors=['All',...new Set(data.rows.map(r=>r.sector).filter(Boolean).sort())],exchanges=['All',...new Set(data.rows.map(r=>r.exchange).filter(Boolean).sort())];return `<section class="filters"><div class="filter"><label>Date range</label><div class="filter-dates"><input id="from" type="date" value="${filter.from}" min="${data.dates[0]}" max="${data.dates.at(-1)}"><input id="to" type="date" value="${filter.to}" min="${data.dates[0]}" max="${data.dates.at(-1)}"></div></div><div class="filter"><label>Sector</label><select id="sector">${sectors.map(x=>`<option ${x===filter.sector?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="filter"><label>Exchange</label><select id="exchange">${exchanges.map(x=>`<option ${x===filter.exchange?'selected':''}>${esc(x)}</option>`).join('')}</select></div>${page==='detail'?`<div class="filter"><label>Ticker</label><select id="ticker">${data.metrics.map(m=>`<option ${m.ticker===stock?'selected':''}>${esc(m.ticker)}</option>`).join('')}</select></div>`:'<div></div>'}<button class="reset" id="reset">Reset filters</button></section>`}
  function card(label,value,sub='',color=''){return `<article class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value ${color}">${value}</div><div class="kpi-sub">${sub}</div></article>`}
  function panel(title,body,sub=''){return `<section class="panel"><h2>${title}${sub?`<span class="sub">${sub}</span>`:''}</h2>${body}</section>`}
  function lineChart(series,{height=260,percent=false,fill=false}={}){const W=800,H=height,L=42,R=14,T=12,B=25,all=series.flatMap(s=>s.points.map(p=>p.y)).filter(Number.isFinite);if(!all.length)return `<div class="empty">No data for this selection</div>`;let min=Math.min(...all),max=Math.max(...all);if(min===max){min-=1;max+=1}const pad=(max-min)*.08;min-=pad;max+=pad;const x=i=>L+(W-L-R)*(i/Math.max(1,(series[0].points.length-1))),y=v=>T+(H-T-B)*(1-(v-min)/(max-min));let grid='';for(let i=0;i<5;i++){const yy=T+(H-T-B)*i/4,val=max-(max-min)*i/4;grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e9edf0"/><text x="${L-7}" y="${yy+3}" text-anchor="end">${percent?fmt(val,0):fmt(val,0)}</text>`}let paths=series.map((s,j)=>{const pts=s.points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');return `<path d="${pts}" fill="none" stroke="${s.color||COLORS[j%COLORS.length]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`}).join('');let axis=`<text x="${L}" y="${H-6}">${esc(series[0].points[0]?.date?.slice(0,4)||'')}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${esc(series[0].points.at(-1)?.date?.slice(0,4)||'')}</text>`;let area='';if(fill&&series.length){const s=series[0],pts=s.points.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p.y)}`).join(' ');area=`<path d="${pts} L${x(s.points.length-1)},${H-B} L${L},${H-B} Z" fill="${s.color||COLORS[0]}" opacity=".11"/>`}return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${area}${paths}${axis}</svg>`}
  function legend(items){return `<div class="legend">${items.map((x,i)=>`<span><i class="swatch" style="background:${x.color||COLORS[i%COLORS.length]}"></i>${esc(x.label)}</span>`).join('')}</div>`}
  function bars(items,{height=260}={}){const max=Math.max(1,...items.map(x=>Math.abs(x.value)));return `<div class="barlist" style="min-height:${height-10}px">${items.map(x=>`<div class="barrow"><div class="barname" title="${esc(x.label)}">${esc(x.label)}</div><div class="bartrack"><div class="bar" style="width:${Math.max(1,Math.abs(x.value)/max*100)}%;background:${x.value<0?'var(--red)':x.color||'var(--green)'}"></div></div><div class="barvalue ${x.value<0?'negative':'positive'}">${pct(x.value,0)}</div></div>`).join('')}</div>`}
  function overview(){const selected=rows(),byTicker=retMap(selected),dates=dateRows(),metrics=data.metrics.filter(m=>selected.some(r=>r.ticker===m.ticker));const marketStart=dates[0]?.market_index||1,marketEnd=dates.at(-1)?.market_index||1,marketReturn=100*(marketEnd/marketStart-1);const ranked=Object.entries(byTicker).sort((a,b)=>b[1]-a[1]),best=ranked[0]||['—',0],worst=ranked.at(-1)||['—',0],vol=metrics.length?metrics.reduce((s,m)=>s+m.volatility_pct,0)/metrics.length:0,volume=selected.reduce((s,r)=>s+r.volume,0);const tickers=data.metrics.map(m=>m.ticker);const colors=Object.fromEntries(tickers.map((t,i)=>[t,COLORS[i%COLORS.length]]));const lines=tickers.map(t=>{const g=selected.filter(r=>r.ticker===t).sort((a,b)=>a.date.localeCompare(b.date)),base=g[0]?.close||1;return {label:t,color:colors[t],points:g.filter((_,i)=>i%3===0||i===g.length-1).map(r=>({date:r.date,y:r.close/base*100}))}}).filter(s=>s.points.length);const market=[{label:'Market index',color:'#11b8a7',points:dates.map(r=>({date:r.date,y:r.market_index}))}];const sectorVals={};Object.entries(data.companyByTicker).forEach(([t,c])=>{if(byTicker[t]!==undefined){(sectorVals[c.sector]??=[]).push(byTicker[t])}});const sectors=Object.entries(sectorVals).map(([label,v])=>({label,value:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.value-a.value);return `<div class="kpis">${card('Market index return',pct(marketReturn),`${dates[0]?.date||''} — ${dates.at(-1)?.date||''}`,marketReturn>=0?'positive':'negative')}${card('Best stock',best[0],pct(best[1],0),'positive')}${card('Worst stock',worst[0],pct(worst[1],0),'negative')}${card('Avg volatility (annual)',`${fmt(vol,1)}%`,'Full-period risk metrics')}${card('Total volume',short(volume),'shares traded')}</div><div class="grid">${panel('Indexed price · start = 100',lineChart(lines),legend(lines.map(s=>({label:s.label,color:s.color}))))}${panel('Market index trend',lineChart(market,{fill:true}))}${panel('Total return by stock',bars(ranked.map(([label,value])=>({label,value}))))}${panel('Average return by sector',bars(sectors))}</div>`}
  function risk(){const metrics=data.metrics.filter(m=>rows().some(r=>r.ticker===m.ticker));const pts=metrics.map(m=>({ticker:m.ticker,x:m.volatility_pct,y:m.annual_return_pct}));const W=800,H=280,L=48,R=20,T=15,B=32,maxX=Math.max(...pts.map(p=>p.x),1)*1.12,minY=Math.min(0,...pts.map(p=>p.y))-4,maxY=Math.max(...pts.map(p=>p.y))+6,x=v=>L+(W-L-R)*v/maxX,y=v=>T+(H-T-B)*(1-(v-minY)/(maxY-minY));let grid='';for(let i=0;i<5;i++){let yy=T+(H-T-B)*i/4,val=maxY-(maxY-minY)*i/4;grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e9edf0"/><text x="${L-7}" y="${yy+4}" text-anchor="end">${fmt(val,0)}%</text>`}for(let i=0;i<5;i++){let xx=L+(W-L-R)*i/4;grid+=`<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H-B}" stroke="#f1f3f5"/><text x="${xx}" y="${H-10}" text-anchor="middle">${fmt(maxX*i/4,0)}%</text>`}const dots=pts.map((p,i)=>`<circle cx="${x(p.x)}" cy="${y(p.y)}" r="6" fill="${p.y>=0?'#18a957':'#e43c3c'}" opacity=".88"/><text x="${x(p.x)+9}" y="${y(p.y)+3}" fill="#3d4d60">${esc(p.ticker)}</text>`).join('');const scatter=`<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${dots}</svg>`;const sorted=metrics.slice().sort((a,b)=>b.sharpe-a.sharpe);const table=`<div class="tablewrap"><table class="table"><thead><tr><th>Ticker</th><th>Annual return</th><th>Volatility</th><th>Sharpe</th><th>Beta</th><th>Max drawdown</th><th>VaR 95% 1d</th></tr></thead><tbody>${sorted.map(m=>`<tr><td class="ticker">${m.ticker}</td><td class="${m.annual_return_pct>=0?'positive':'negative'}">${pct(m.annual_return_pct)}</td><td>${fmt(m.volatility_pct)}%</td><td>${fmt(m.sharpe,2)}</td><td>${fmt(m.beta,2)}</td><td class="negative">${fmt(m.max_drawdown_pct)}%</td><td>${fmt(m.var95_1d_pct)}%</td></tr>`).join('')}</tbody></table></div>`;const ts=data.metrics.map(m=>m.ticker),corr=data.correlations;let matrix=`<div class="matrix" style="grid-template-columns:repeat(${ts.length+1},minmax(34px,1fr))"><div></div>${ts.map(t=>`<div class="mhead">${t}</div>`).join('')}${ts.map(a=>`<div class="mhead">${a}</div>${ts.map(b=>{const v=corr[`${a}|${b}`]??0;const hue=v>=0?160:5;return `<div class="mcell" style="background:hsl(${hue} 48% ${94-Math.abs(v)*38}%);color:${Math.abs(v)>.62?'#fff':'#344459'}" title="${a} vs ${b}">${fmt(v,2)}</div>`}).join('')}`).join('')}</div>`;const ddTicker=data.metrics.some(m=>m.ticker===stock)?stock:data.metrics[0].ticker;const dd=rows().filter(r=>r.ticker===ddTicker).sort((a,b)=>a.date.localeCompare(b.date));const draw=dd.filter((_,i)=>i%3===0||i===dd.length-1).map(r=>({date:r.date,y:r.drawdown_pct}));return `<div class="grid">${panel('Risk vs annual return',scatter,'Each point is a stock')}${panel('Full-period risk metrics',table,'Date filter does not change these values')}${panel('Daily return correlation',matrix,'Full period · darker = stronger relationship')}${panel(`Drawdown · ${ddTicker}`,lineChart([{label:ddTicker,points:draw,color:'#e43c3c'}],{percent:true}))}</div><div class="note" style="margin-top:14px">Risk metrics and correlations use the full available period, as required by the source guide. The date range filter changes the drawn drawdown series but does not recalculate those full-period metrics.</div>`}
  function detail(){const selected=rows().filter(r=>r.ticker===stock).sort((a,b)=>a.date.localeCompare(b.date)),c=data.companyByTicker[stock]||{},m=data.metrics.find(x=>x.ticker===stock)||{};if(!selected.length)return `<div class="panel empty">No rows for ${esc(stock)} in the selected filters.</div>`;const last=selected.at(-1),first=selected[0],ret=100*(last.close/first.close-1),lines=[{label:'Close',color:'#11b8a7',points:selected.filter((_,i)=>i%2===0||i===selected.length-1).map(r=>({date:r.date,y:r.close}))},{label:'20-day average',color:'#5376ed',points:selected.filter((_,i)=>i%2===0||i===selected.length-1).map(r=>({date:r.date,y:r.ma20}))},{label:'50-day average',color:'#e7a02a',points:selected.filter((_,i)=>i%2===0||i===selected.length-1).map(r=>({date:r.date,y:r.ma50}))}];const month=new Map();selected.forEach(r=>{const k=r.date.slice(0,7);month.set(k,(month.get(k)||0)+r.volume)});const volumeBars=[...month].slice(-18).map(([label,value])=>({label,value}));const rets=selected.map(r=>r.daily_return_pct).filter(Number.isFinite),lo=Math.min(...rets),hi=Math.max(...rets),bins=12,counts=Array(bins).fill(0);rets.forEach(v=>counts[Math.min(bins-1,Math.floor((v-lo)/(hi-lo||1)*bins))]++);const maxC=Math.max(...counts,1);const hist=`<svg class="chart" viewBox="0 0 800 260"><line x1="42" y1="230" x2="790" y2="230" stroke="#dce3e8"/>${counts.map((n,i)=>{const w=748/bins-4,x=44+i*748/bins,y=220-n/maxC*185;return `<rect x="${x}" y="${y}" width="${w}" height="${220-y}" rx="3" fill="${(i/bins)>(-lo/(hi-lo||1))?'#18a957':'#e43c3c'}" opacity=".84"/>`}).join('')}<text x="42" y="250">${fmt(lo,1)}%</text><text x="790" y="250" text-anchor="end">${fmt(hi,1)}%</text></svg>`;return `<div class="detail-head"><div><div class="company">${esc(c.company_name||stock)} <span class="ticker">(${esc(stock)})</span></div><div class="company-meta">${esc(c.sector||'')} · ${esc(c.exchange||'')} · ${esc(c.currency||'')} · close ${fmt(last.close,2)}</div></div></div><div class="detail-kpis"><div class="mini"><small>Selected-period return</small><b class="${ret>=0?'positive':'negative'}">${pct(ret)}</b></div><div class="mini"><small>Annualized volatility</small><b>${fmt(m.volatility_pct)}%</b></div><div class="mini"><small>Beta</small><b>${fmt(m.beta,2)}</b></div><div class="mini"><small>Dividend yield</small><b>${fmt(c.dividend_yield_pct,2)}%</b></div></div><div class="grid">${panel('Close with 20- and 50-day averages',lineChart(lines),legend(lines.map(s=>({label:s.label,color:s.color}))))}${panel('Daily return distribution',hist,'Daily change in close')}${panel('Monthly volume',bars(volumeBars,{height:260}))}${panel('Selected-stock snapshot',`<div class="tablewrap"><table class="table"><tbody><tr><td>Period start</td><td>${first.date}</td></tr><tr><td>Period end</td><td>${last.date}</td></tr><tr><td>Latest close</td><td>${fmt(last.close,2)} ${esc(c.currency||'')}</td></tr><tr><td>Period high</td><td>${fmt(Math.max(...selected.map(r=>r.high)),2)}</td></tr><tr><td>Period low</td><td>${fmt(Math.min(...selected.map(r=>r.low)),2)}</td></tr><tr><td>Full-period maximum drawdown</td><td class="negative">${fmt(m.max_drawdown_pct)}%</td></tr><tr><td>Price-to-earnings</td><td>${fmt(c.pe_ratio,1)}</td></tr></tbody></table></div>`)} </div>`}
  function draw(){if(!data)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageTitle').textContent=page==='overview'?'Market Overview':page==='risk'?'Risk & Return':'Stock Detail';$('#app').innerHTML=controls()+(page==='overview'?overview():page==='risk'?risk():detail())+`<footer class="foot"><span>Source: synthetic mock data · not real market information</span><span>Gulf Market Tracker · ${data.dates[0]} to ${data.dates.at(-1)}</span></footer>`;$('#from').onchange=e=>{filter.from=e.target.value;draw()};$('#to').onchange=e=>{filter.to=e.target.value;draw()};$('#sector').onchange=e=>{filter.sector=e.target.value;draw()};$('#exchange').onchange=e=>{filter.exchange=e.target.value;draw()};if($('#ticker'))$('#ticker').onchange=e=>{stock=e.target.value;draw()};$('#reset').onclick=()=>{filter={sector:'All',exchange:'All',from:data.dates[0],to:data.dates.at(-1)};stock='SKA';draw()}}
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;draw()}));
  </script>
